<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Upload Resume | CVision AI</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <!-- Navigation -->
    <nav>
        <div class="logo">CVision AI</div>

        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="index.html#features">Features</a>
        </div>

        <a href="index.html" class="nav-button">Back Home</a>
    </nav>


    <!-- Upload Section -->
    <section class="upload-section">

        <div class="upload-header">

            <span class="badge">AI Resume Analyzer</span>

            <h1>Upload Your Resume</h1>

            <p>
                Upload your resume and let CVision AI analyze
                your skills, ATS score, job match, and improvement areas.
            </p>

        </div>


        <!-- Upload Box -->
        <div class="upload-box">

            <div class="upload-icon">📄</div>

            <h2>Upload Your Resume</h2>

            <p>
                Choose a PDF resume to begin your analysis.
            </p>


            <!-- Resume File -->
            <input
                type="file"
                id="resumeFile"
                accept=".pdf"
                hidden
            >

            <label for="resumeFile" class="primary-btn">
                Choose Resume
            </label>


            <!-- Selected File -->
            <p id="fileStatus"></p>


            <!-- Job Role -->
            <label for="jobRole" class="form-label">
                Target Job Role
            </label>

            
<select id="jobRole">
    <option value="">Select Your Field</option>

    <option value="Software Engineering">Software Engineering</option>
    <option value="Web Development">Web Development</option>
    <option value="Mobile App Development">Mobile App Development</option>
    <option value="DevOps">DevOps & Cloud</option>
    <option value="Cybersecurity">Cybersecurity</option>
    <option value="Data Science">Data Science</option>
    <option value="AI/ML">Artificial Intelligence & Machine Learning</option>
    <option value="Data Engineering">Data Engineering</option>
    <option value="Database Administration">Database Administration</option>
    <option value="QA & Software Testing">QA & Software Testing</option>
    <option value="Networking">Networking</option>
    <option value="System Administration">System Administration</option>
    <option value="IT Support">IT Support</option>

    <option value="UI/UX Design">UI/UX Design</option>
    <option value="Graphic Design">Graphic Design</option>
    <option value="Product Design">Product Design</option>

    <option value="Project Management">Project Management</option>
    <option value="Product Management">Product Management</option>
    <option value="Business Analysis">Business Analysis</option>
    <option value="Business Development">Business Development</option>
    <option value="Digital Marketing">Digital Marketing</option>
    <option value="Sales">Sales</option>
    <option value="Finance & Accounting">Finance & Accounting</option>
    <option value="Human Resources">Human Resources</option>
    <option value="Operations">Operations</option>

    <option value="Healthcare">Healthcare</option>
    <option value="Education">Education</option>
    <option value="Legal">Legal</option>
    <option value="Architecture">Architecture</option>
    <option value="Engineering">Engineering</option>
    <option value="Research">Research</option>

    <option value="Other">Other</option>
</select>



            <!-- File Information -->
            <small id="fileInfo">
                PDF only • Maximum 5MB
            </small>


            <!-- Analyze Button -->
            <button
                id="analyzeBtn"
                class="primary-btn"
                type="button"
            >
                Analyze Resume
            </button>


            <!-- Result / Error -->
            <p id="uploadResult"></p>

        </div>

    </section>


    <script src="js/script.js"></script>

</body>
</html>
